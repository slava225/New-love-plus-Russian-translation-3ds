name: Build Azur Lane JP Downloader APK

on:
  push:
    branches:
      - azurlane-jp-android-downloader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix Material primary attr compatibility
        run: sed -i 's/com.google.android.material.R.attr.colorPrimary/androidx.appcompat.R.attr.colorPrimary/g' azurlane-jp-downloader-android/app/src/main/java/ru/slava/azljpdownloader/MainActivity.java

      - name: Build debug APK
        working-directory: azurlane-jp-downloader-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp azurlane-jp-downloader-android/app/build/outputs/apk/debug/app-debug.apk AzurLane-JP-Downloader-v0.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzurLane-JP-Downloader-v0.3.0
          path: AzurLane-JP-Downloader-v0.3.0.apk
          if-no-files-found: error
